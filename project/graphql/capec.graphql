# metamodel_version: 1.12.0
# version: 3.9
enum CapecAbstraction
  {
    Meta
    Standard
    Detailed
  }

enum CapecAttackStepPhase
  {
    Explore
    Experiment
    Exploit
  }

enum CapecContributionType
  {
    Content
    Feedback
  }

enum CapecImportance
  {
    Normal
    Critical
  }

enum CapecLikelihood
  {
    High
    Medium
    Low
    Unknown
  }

enum CapecNoteType
  {
    Maintenance
    Relationship
    Research_Gap
    Terminology
    Other
  }

enum CapecRelatedNature
  {
    ChildOf
    ParentOf
    CanFollow
    CanPrecede
    CanAlsoBe
    PeerOf
  }

enum CapecScope
  {
    Confidentiality
    Integrity
    Availability
    Access_Control
    Accountability
    Authentication
    Authorization
    Non__HYPHEN_MINUS__Repudiation
    Other
  }

enum CapecSeverity
  {
    Very_High
    High
    Medium
    Low
    Very_Low
  }

enum CapecSkillLevel
  {
    High
    Medium
    Low
    Unknown
  }

enum CapecStakeholderType
  {
    Academic_Researchers
    Applied_Researchers
    Assessment_Customers
    Assessment_Vendors
    CAPEC_Team
    Educators
    Information_Providers
    Software_Customers
    Software_Designers
    Software_Developers
    Software_Vendors
    Other
  }

enum CapecStatus
  {
    Deprecated
    Draft
    Incomplete
    Obsolete
    Stable
    Usable
  }

enum CapecTaxonomyMappingFit
  {
    Exact
    CAPEC_More_Abstract
    CAPEC_More_Specific
    Imprecise
    Perspective
  }

enum CapecTaxonomyName
  {
    ATTACK
    WASC
    OWASP_Attacks
  }

enum CapecTechnicalImpact
  {
    Modify_Data
    Read_Data
    Unreliable_Execution
    Resource_Consumption
    Execute_Unauthorized_Commands
    Gain_Privileges
    Bypass_Protection_Mechanism
    Hide_Activities
    Alter_Execution_Logic
    Other
  }

enum CapecViewType
  {
    Implicit
    Explicit
    Graph
  }

type CapecAlternateTerm
  {
    term: String!
    description: CapecStructuredText
  }

type CapecAttackPattern implements CapecTaxonomyMappedMixin
  {
    iD: CapecNumericId!
    name: String!
    status: CapecStatus!
    references: [CapecReference]
    notes: [CapecNote]
    contentHistory: CapecContentHistory
    abstraction: CapecAbstraction!
    description: CapecStructuredText!
    extendedDescription: CapecStructuredText
    alternateTerms: [CapecAlternateTerm]
    likelihoodOfAttack: CapecLikelihood
    typicalSeverity: CapecSeverity
    relatedAttackPatterns: [CapecRelatedAttackPattern]
    executionFlow: [CapecAttackStep]
    prerequisites: [CapecStructuredText]
    skillsRequired: [CapecSkill]
    resourcesRequired: [CapecStructuredText]
    indicators: [CapecStructuredText]
    consequences: [CapecConsequence]
    mitigations: [CapecStructuredText]
    exampleInstances: [CapecStructuredText]
    relatedWeaknesses: [CapecRelatedWeakness]
    taxonomyMappings: [CapecTaxonomyMapping]
  }

type CapecAttackPatternCatalog
  {
    name: String!
    version: String!
    date: String!
    attackPatterns: [CapecAttackPattern]
    categories: [CapecCategory]
    views: [CapecView]
    externalReferences: [CapecExternalReference]
  }

type CapecAttackStep
  {
    step: Int!
    phase: CapecAttackStepPhase!
    description: CapecStructuredText!
    technique: [CapecTechnique]
  }

type CapecCategory implements CapecTaxonomyMappedMixin
  {
    iD: CapecNumericId!
    name: String!
    status: CapecStatus!
    references: [CapecReference]
    notes: [CapecNote]
    contentHistory: CapecContentHistory
    summary: CapecStructuredText!
    relationships: CapecRelationships
    taxonomyMappings: [CapecTaxonomyMapping]
  }

type CapecConsequence
  {
    consequenceID: String
    scope: [CapecScope]!
    impact: [CapecTechnicalImpact]
    likelihood: CapecLikelihood
    note: CapecStructuredText
  }

type CapecContentHistory
  {
    submission: CapecSubmission
    modification: [CapecModification]
    contribution: [CapecContribution]
    previousEntryName: [CapecPreviousEntryName]
  }

type CapecContribution
  {
    type: CapecContributionType!
    contributionName: String
    contributionOrganization: String
    contributionDate: String
    contributionComment: String
  }

interface CapecEntry
  {
    iD: CapecNumericId!
    name: String!
    status: CapecStatus!
    references: [CapecReference]
    notes: [CapecNote]
    contentHistory: CapecContentHistory
  }

type CapecExcludeRelated
  {
    excludeID: CapecEntry!
  }

interface CapecExclusionsMixin
  {
    excludeRelated: [CapecExcludeRelated]
  }

type CapecExternalReference
  {
    referenceID: CapecReferenceId!
    author: [String]
    title: String!
    edition: String
    publication: String
    publicationYear: CapecYear
    publicationMonth: CapecMonth
    publicationDay: CapecDay
    publisher: String
    uRL: CapecUri
    uRLDate: String
  }

type CapecHasMember implements CapecExclusionsMixin
  {
    cAPECID: CapecEntry!
    excludeRelated: [CapecExcludeRelated]
  }

type CapecMemberOf implements CapecExclusionsMixin
  {
    cAPECID: CapecEntry!
    excludeRelated: [CapecExcludeRelated]
  }

type CapecModification
  {
    modificationName: String
    modificationOrganization: String
    modificationDate: String
    modificationImportance: CapecImportance
    modificationComment: String
  }

type CapecNote
  {
    type: CapecNoteType!
    value: CapecStructuredText!
  }

type CapecPreviousEntryName
  {
    date: String!
    value: String!
  }

type CapecReference
  {
    externalReferenceID: CapecExternalReference!
    section: String
  }

type CapecRelatedAttackPattern implements CapecExclusionsMixin
  {
    nature: CapecRelatedNature!
    cAPECID: CapecAttackPattern!
    excludeRelated: [CapecExcludeRelated]
  }

type CapecRelatedWeakness
  {
    cWEID: CapecNumericId!
  }

type CapecRelationships
  {
    memberOf: [CapecMemberOf]
    hasMember: [CapecHasMember]
  }

type CapecSkill
  {
    level: CapecSkillLevel!
    value: String!
  }

type CapecStakeholder
  {
    type: CapecStakeholderType!
    description: CapecStructuredText!
  }

type CapecSubmission
  {
    submissionName: String
    submissionOrganization: String
    submissionDate: String
    submissionComment: String
  }

interface CapecTaxonomyMappedMixin
  {
    taxonomyMappings: [CapecTaxonomyMapping]
  }

type CapecTaxonomyMapping
  {
    taxonomyName: CapecTaxonomyName!
    entryID: String
    entryName: String
    mappingFit: CapecTaxonomyMappingFit
  }

type CapecTechnique
  {
    cAPECID: CapecEntry
    value: CapecStructuredText!
  }

type CapecView
  {
    iD: CapecNumericId!
    name: String!
    status: CapecStatus!
    references: [CapecReference]
    notes: [CapecNote]
    contentHistory: CapecContentHistory
    type: CapecViewType!
    objective: CapecStructuredText!
    audience: [CapecStakeholder]
    members: CapecRelationships
    filter: String
  }

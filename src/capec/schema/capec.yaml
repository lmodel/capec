---
id: https://w3id.org/lmodel/capec
name: capec
title: Common Attack Pattern Enumeration and Classification (CAPEC)
description: >-
  A LinkML model of the CAPEC catalogue. It keeps the keys and listed values of the
  catalogue's XML Schema, so the catalogue validates as MITRE spells it once
  scripts/capec_to_json.py has turned it into data.
version: "3.9"
source: https://capec.mitre.org/data/xsd/ap_schema_v3.5.xsd
license: Apache-2.0
keywords:
  - attack pattern
  - CAPEC
  - threat modelling
  - adversary technique
  - MITRE
see_also:
  - https://lmodel.github.io/capec
  - https://capec.mitre.org/
annotations:
  xsd_version: "3.5"
  xsd_namespace: http://capec.mitre.org/capec-3
  xsd_date: "2021-10-21"
  catalogue_date: "2023-01-24"
comments:
  - >-
    The version is the version of the catalogue that the schema renders, and
    xsd_version is the version of the XSD that catalogue names. upstream/ holds both
    files unchanged, tests/test_coverage.py holds the schema to the XSD, and
    scripts/check_upstream_release.py reports when either moves.
  - >-
    MITRE's latest catalogue is dated January 2023 and its latest news item March
    2023. No page says CAPEC has stopped, so the watch keeps asking.
prefixes:
  capec: https://w3id.org/lmodel/capec/
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  skos: http://www.w3.org/2004/02/skos/core#
  wd: http://www.wikidata.org/entity/
default_prefix: capec
default_range: string

imports:
  - linkml:types
  - ./capec_core
  - ./capec_entries

classes:

  CapecAttackPatternCatalog:
    tree_root: true
    description: One release of the whole catalogue, with its entries and the references they share.
    annotations:
      xsd_type: Attack_Pattern_Catalog
    close_mappings:
      - schema:DefinedTermSet
      - skos:ConceptScheme
      - wd:Q2986817
    attributes:
      Name:
        required: true
        description: The catalogue's name.
        close_mappings:
          - schema:name
      Version:
        required: true
        description: The catalogue's version, which together with its name identifies it.
        close_mappings:
          - schema:version
      Date:
        required: true
        range: date
        description: The day this catalogue was made or last updated.
        close_mappings:
          - dcterms:date
      Attack_Patterns:
        range: CapecAttackPattern
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: The attack patterns.
      Categories:
        range: CapecCategory
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: The categories.
      Views:
        range: CapecView
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: The views.
      External_References:
        range: CapecExternalReference
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: The external references that entries cite.

name: capec
annotations:
  xsd_version:
    tag: xsd_version
    value: '3.5'
  xsd_namespace:
    tag: xsd_namespace
    value: http://capec.mitre.org/capec-3
  xsd_date:
    tag: xsd_date
    value: '2021-10-21'
  catalogue_date:
    tag: catalogue_date
    value: '2023-01-24'
description: A LinkML model of the CAPEC catalogue. It keeps the keys and listed values
  of the catalogue's XML Schema, so the catalogue validates as MITRE spells it once
  scripts/capec_to_json.py has turned it into data.
title: Common Attack Pattern Enumeration and Classification (CAPEC)
comments:
- The version is the version of the catalogue that the schema renders, and xsd_version
  is the version of the XSD that catalogue names. upstream/ holds both files unchanged,
  tests/test_coverage.py holds the schema to the XSD, and scripts/check_upstream_release.py
  reports when either moves.
- MITRE's latest catalogue is dated January 2023 and its latest news item March 2023.
  No page says CAPEC has stopped, so the watch keeps asking.
source: https://capec.mitre.org/data/xsd/ap_schema_v3.5.xsd
see_also:
- https://lmodel.github.io/capec
- https://capec.mitre.org/
keywords:
- attack pattern
- CAPEC
- threat modelling
- adversary technique
- MITRE
id: https://w3id.org/lmodel/capec
version: '3.9'
imports:
- linkml:types
- ./capec_core
- ./capec_entries
license: Apache-2.0
prefixes:
  capec:
    prefix_prefix: capec
    prefix_reference: https://w3id.org/lmodel/capec/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  dcterms:
    prefix_prefix: dcterms
    prefix_reference: http://purl.org/dc/terms/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
  wd:
    prefix_prefix: wd
    prefix_reference: http://www.wikidata.org/entity/
default_prefix: capec
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  capec_numeric_id:
    name: capec_numeric_id
    definition_uri: https://w3id.org/lmodel/capec/CapecNumericId
    description: The number of a CAPEC entry or a CWE weakness, written as a string
      of digits.
    comments:
    - The XSD types these as xs:integer. They name things and nothing counts them,
      and the rdflib dumper in linkml-runtime 1.12.1 cannot turn a bare identifier
      into an IRI, so the digits stay a string.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[1-9][0-9]*$
  capec_reference_id:
    name: capec_reference_id
    definition_uri: https://w3id.org/lmodel/capec/CapecReferenceId
    description: The identifier of an external reference, such as REF-1.
    comments:
    - The XSD types this as xs:string and gives REF-1 as its form, which every reference
      in the catalogue follows.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^REF-[0-9]+$
  capec_structured_text:
    name: capec_structured_text
    definition_uri: https://w3id.org/lmodel/capec/CapecStructuredText
    description: Text that may hold XHTML markup such as paragraphs and lists, with
      no namespace prefix.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    typeof: string
    base: str
    uri: xsd:string
  capec_uri:
    name: capec_uri
    definition_uri: https://w3id.org/lmodel/capec/CapecUri
    description: A web address, as the XSD's xs:anyURI holds it.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    typeof: uri
    base: URI
    uri: xsd:anyURI
    repr: str
  capec_year:
    name: capec_year
    definition_uri: https://w3id.org/lmodel/capec/CapecYear
    description: A year in the XSD's xs:gYear form, such as 2004.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^-?([1-9][0-9]{3,}|0[0-9]{3})(Z|[+-]((0[0-9]|1[0-3]):[0-5][0-9]|14:00))?$
  capec_month:
    name: capec_month
    definition_uri: https://w3id.org/lmodel/capec/CapecMonth
    description: A month in the XSD's xs:gMonth form, such as --02 for February.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^--(0[1-9]|1[0-2])(Z|[+-]((0[0-9]|1[0-3]):[0-5][0-9]|14:00))?$
  capec_day:
    name: capec_day
    definition_uri: https://w3id.org/lmodel/capec/CapecDay
    description: A day of the month in the XSD's xs:gDay form, such as ---08.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^---(0[1-9]|[12][0-9]|3[01])(Z|[+-]((0[0-9]|1[0-3]):[0-5][0-9]|14:00))?$
enums:
  CapecImportance:
    name: CapecImportance
    definition_uri: https://w3id.org/lmodel/capec/CapecImportance
    annotations:
      xsd_type:
        tag: xsd_type
        value: ImportanceEnumeration
    description: How much a change to an entry matters to anyone relying on it.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    permissible_values:
      Normal:
        text: Normal
        description: A change that leaves the entry's meaning as it was.
      Critical:
        text: Critical
        description: A change to the entry's meaning or to how it may be read.
  CapecNoteType:
    name: CapecNoteType
    definition_uri: https://w3id.org/lmodel/capec/CapecNoteType
    annotations:
      xsd_type:
        tag: xsd_type
        value: NoteTypeEnumeration
    description: What kind of remark a note makes.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    permissible_values:
      Maintenance:
        text: Maintenance
        description: Work on the entry still to be done.
      Relationship:
        text: Relationship
        description: Detail on how entries relate.
      Research Gap:
        text: Research Gap
        description: Something the research community could look into further.
      Terminology:
        text: Terminology
        description: A question of wording, such as competing uses of one term.
      Other:
        text: Other
        description: A remark of no listed kind.
  CapecStatus:
    name: CapecStatus
    definition_uri: https://w3id.org/lmodel/capec/CapecStatus
    annotations:
      xsd_type:
        tag: xsd_type
        value: StatusEnumeration
    description: How far an entry has got through CAPEC's review.
    comments:
    - The XSD and MITRE's schema documentation list these values and define only what
      happens to a deprecated entry, so the others carry no description here.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    permissible_values:
      Deprecated:
        text: Deprecated
        description: Withdrawn from the catalogue, though its number stays taken.
      Draft:
        text: Draft
      Incomplete:
        text: Incomplete
      Obsolete:
        text: Obsolete
      Stable:
        text: Stable
      Usable:
        text: Usable
  CapecTaxonomyMappingFit:
    name: CapecTaxonomyMappingFit
    definition_uri: https://w3id.org/lmodel/capec/CapecTaxonomyMappingFit
    annotations:
      xsd_type:
        tag: xsd_type
        value: TaxonomyMappingFitEnumeration
    description: How well an entry fits the entry of another taxonomy that it maps
      to.
    comments:
    - The XSD and MITRE's schema documentation list these values without defining
      them. The mappings rest on the names of the first three values, and CAPEC 3.9
      sets none of them.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    permissible_values:
      Exact:
        text: Exact
        close_mappings:
        - skos:exactMatch
      CAPEC More Abstract:
        text: CAPEC More Abstract
        close_mappings:
        - skos:narrowMatch
      CAPEC More Specific:
        text: CAPEC More Specific
        close_mappings:
        - skos:broadMatch
      Imprecise:
        text: Imprecise
      Perspective:
        text: Perspective
  CapecTaxonomyName:
    name: CapecTaxonomyName
    definition_uri: https://w3id.org/lmodel/capec/CapecTaxonomyName
    annotations:
      xsd_type:
        tag: xsd_type
        value: TaxonomyNameEnumeration
    description: The other taxonomies that CAPEC maps to.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    permissible_values:
      ATTACK:
        text: ATTACK
        description: MITRE ATT&CK. An entry's Entry_ID there is the technique's number
          without its T.
      WASC:
        text: WASC
        description: The Web Application Security Consortium's threat classification.
      OWASP Attacks:
        text: OWASP Attacks
        description: The attack list of the Open Worldwide Application Security Project.
  CapecContributionType:
    name: CapecContributionType
    definition_uri: https://w3id.org/lmodel/capec/CapecContributionType
    annotations:
      xsd_type:
        tag: xsd_type
        value: ContentHistoryType/Contribution/@Type
    description: Whether a contribution changed an entry's content or only commented
      on it.
    from_schema: https://w3id.org/lmodel/capec/capec_core
    permissible_values:
      Content:
        text: Content
        description: Text given to the entry.
      Feedback:
        text: Feedback
        description: Remarks on the entry.
  CapecAbstraction:
    name: CapecAbstraction
    definition_uri: https://w3id.org/lmodel/capec/CapecAbstraction
    annotations:
      xsd_type:
        tag: xsd_type
        value: AbstractionEnumeration
    description: How concrete an attack pattern is.
    from_schema: https://w3id.org/lmodel/capec/capec_entries
    permissible_values:
      Meta:
        text: Meta
        description: A broad approach, free of any one technology, for use in design-level
          threat modelling.
      Standard:
        text: Standard
        description: One method or technique, often only a part of a whole attack.
      Detailed:
        text: Detailed
        description: One technique against one technology, usually with its steps
          set out.
  CapecLikelihood:
    name: CapecLikelihood
    definition_uri: https://w3id.org/lmodel/capec/CapecLikelihood
    annotations:
      xsd_type:
        tag: xsd_type
        value: LikelihoodEnumeration
    description: How likely something is to happen.
    from_schema: https://w3id.org/lmodel/capec/capec_entries
    permissible_values:
      High:
        text: High
      Medium:
        text: Medium
      Low:
        text: Low
      Unknown:
        text: Unknown
        description: Nobody knows how likely it is.
  CapecRelatedNature:
    name: CapecRelatedNature
    definition_uri: https://w3id.org/lmodel/capec/CapecRelatedNature
    annotations:
      xsd_type:
        tag: xsd_type
        value: RelatedNatureEnumeration
    description: How one attack pattern relates to another.
    comments:
    - 'The natures come in pairs: ChildOf and ParentOf, CanFollow and CanPrecede.
      The XSD says CanAlsoBe need not hold in both directions and says nothing on
      whether PeerOf does. CAPEC 3.9 uses ChildOf and never ParentOf, and records
      no pair from both ends.'
    from_schema: https://w3id.org/lmodel/capec/capec_entries
    permissible_values:
      ChildOf:
        text: ChildOf
        description: The other pattern is more abstract, and this one specialises
          it.
        annotations:
          inverse:
            tag: inverse
            value: ParentOf
        close_mappings:
        - skos:broader
      ParentOf:
        text: ParentOf
        description: The other pattern is less abstract, and it specialises this one.
        annotations:
          inverse:
            tag: inverse
            value: ChildOf
        close_mappings:
        - skos:narrower
      CanFollow:
        text: CanFollow
        description: In a chain of attack, this pattern may come after the other.
        annotations:
          inverse:
            tag: inverse
            value: CanPrecede
      CanPrecede:
        text: CanPrecede
        description: In a chain of attack, this pattern may come before the other.
        annotations:
          inverse:
            tag: inverse
            value: CanFollow
      CanAlsoBe:
        text: CanAlsoBe
        description: In some settings this pattern can also be read as the other one,
          though not always the reverse.
      PeerOf:
        text: PeerOf
        description: The two are alike in a way that no other nature covers.
        related_mappings:
        - skos:related
  CapecScope:
    name: CapecScope
    definition_uri: https://w3id.org/lmodel/capec/CapecScope
    annotations:
      xsd_type:
        tag: xsd_type
        value: ScopeEnumeration
    description: The security property that a consequence violates.
    from_schema: https://w3id.org/lmodel/capec/capec_entries
    permissible_values:
      Confidentiality:
        text: Confidentiality
      Integrity:
        text: Integrity
      Availability:
        text: Availability
      Access Control:
        text: Access Control
      Accountability:
        text: Accountability
      Authentication:
        text: Authentication
      Authorization:
        text: Authorization
      Non-Repudiation:
        text: Non-Repudiation
      Other:
        text: Other
  CapecSeverity:
    name: CapecSeverity
    definition_uri: https://w3id.org/lmodel/capec/CapecSeverity
    annotations:
      xsd_type:
        tag: xsd_type
        value: SeverityEnumeration
    description: How bad the typical outcome of an attack is.
    from_schema: https://w3id.org/lmodel/capec/capec_entries
    permissible_values:
      Very High:
        text: Very High
      High:
        text: High
      Medium:
        text: Medium
      Low:
        text: Low
      Very Low:
        text: Very Low
  CapecSkillLevel:
    name: CapecSkillLevel
    definition_uri: https://w3id.org/lmodel/capec/CapecSkillLevel
    annotations:
      xsd_type:
        tag: xsd_type
        value: SkillLevelEnumeration
    description: How much skill or knowledge an adversary needs.
    from_schema: https://w3id.org/lmodel/capec/capec_entries
    permissible_values:
      High:
        text: High
      Medium:
        text: Medium
      Low:
        text: Low
      Unknown:
        text: Unknown
        description: Nobody knows how much is needed.
  CapecStakeholderType:
    name: CapecStakeholderType
    definition_uri: https://w3id.org/lmodel/capec/CapecStakeholderType
    annotations:
      xsd_type:
        tag: xsd_type
        value: StakeholderEnumeration
    description: The kinds of people a view is meant for.
    from_schema: https://w3id.org/lmodel/capec/capec_entries
    permissible_values:
      Academic Researchers:
        text: Academic Researchers
      Applied Researchers:
        text: Applied Researchers
      Assessment Customers:
        text: Assessment Customers
      Assessment Vendors:
        text: Assessment Vendors
      CAPEC Team:
        text: CAPEC Team
      Educators:
        text: Educators

ID: '1'
Name: Accessing Functionality Not Properly Constrained by ACLs
Abstraction: Standard
Status: Draft
Description: In applications, particularly web applications, access to functionality is
  mitigated by an authorization framework. This framework maps Access Control Lists (ACLs)
  to elements of the application's functionality; particularly URL's for web apps. In the
  case that the administrator failed to specify an ACL for a particular element, an attacker
  may be able to access it with impunity. An attacker with the ability to access functionality
  not properly constrained by ACLs can obtain sensitive information and possibly compromise
  the entire application. Such an attacker can access resources that must be available only
  to users at a higher privilege level, can access management sections of the application,
  or can run queries for data that they otherwise not supposed to.
Extended_Description: <p>A longer account of the pattern.</p>
Alternate_Terms:
  - Term: Data Spill
    Description: When information is handled by an information system of a classification/sensitivity
      for which the system has not been authorized to handle.
Likelihood_Of_Attack: High
Typical_Severity: High
Related_Attack_Patterns:
  - Nature: ChildOf
    CAPEC_ID: '1'
    Exclude_Related:
      - Exclude_ID: '513'
  - Nature: CanPrecede
    CAPEC_ID: '17'
Execution_Flow:
  - Step: 1
    Phase: Explore
    Description: '[Survey] The attacker surveys the target application, possibly as a valid
      and authenticated user'
    Technique:
      - Value: Spidering web sites for all available links
      - Value: Brute force guessing of resource names
Prerequisites:
  - The application must be navigable in a manner that associates elements (subsections)
    of the application with ACLs.
Skills_Required:
  - Level: Low
    Value: In order to discover unrestricted resources, the attacker does not need special
      tools or skills. They only have to observe the resources or access mechanisms invoked
      as each action is performed and then try and access those access mechanisms directly.
Resources_Required:
  - A tool that lists the addresses of a web site.
Indicators:
  - Requests for pages that no link leads to.
Consequences:
  - Consequence_ID: CC-1
    Scope:
      - Confidentiality
      - Access Control
    Impact:
      - Read Data
      - Gain Privileges
    Likelihood: High
    Note: <p>An adversary who gets this far can read what the role protects.</p>
Mitigations:
  - "<p>In a J2EE setting, administrators can associate a role that is impossible for the\
    \ authenticator to grant users, such as \"NoAccess\", with all Servlets to which access\
    \ is guarded by a limited number of servlets visible to, and accessible by, the user.</p>\n\
    \               <p>Having done so, any direct access to those protected Servlets will\
    \ be prohibited by the web container.</p>\n               <p>In a more general setting,\
    \ the administrator must mark every resource besides the ones supposed to be exposed\
    \ to the user as accessible by a role impossible for the user to assume. The default\
    \ security setting must be to deny access and then grant access only to those resources\
    \ intended by business logic.</p>"
Example_Instances:
  - "<p>Implementing the Model-View-Controller (MVC) within Java EE's Servlet paradigm using\
    \ a \"Single front controller\" pattern that demands that brokered HTTP requests be\
    \ authenticated before hand-offs to other Action Servlets.</p>\n               <p>If\
    \ no security-constraint is placed on those Action Servlets, such that positively no\
    \ one can access them, the front controller can be subverted.</p>"
Related_Weaknesses:
